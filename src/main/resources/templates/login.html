<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"/>
  <title>Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="/css/app.css" rel="stylesheet"/>
</head>
<body>

<div class="page-wrap">
  <div class="card-glass">
    <div class="card-header-custom">
      <h3 class="brand">JWT Login</h3>
      <div class="muted">Đăng nhập để nhận JWT và gọi API protected</div>
    </div>

    <div class="card-body-custom">
      <div id="feedback" class="alert alert-danger d-none mb-3"></div>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-control" placeholder="admin@gmail.com" required/>
      </div>

      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="123456" required/>
      </div>

      <div class="d-grid">
        <button id="Login" class="btn btn-primary btn-lg">Login</button>
      </div>

      <div class="muted mt-3" style="font-size: 13px;">
        Token sẽ được lưu tạm vào <b>localStorage</b> (demo).
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="/js/mainjs.js"></script>
</body>
</html>
